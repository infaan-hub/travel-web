version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travel
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app1:
    build: .
    environment:
      DATABASE_URL: postgresql://travel:travel@postgres:5432/travel
      DIRECT_URL: postgresql://travel:travel@postgres:5432/travel
      CACHE_URL: ${CACHE_URL}
      CACHE_TOKEN: ${CACHE_TOKEN}
      RATE_LIMIT_URL: ${RATE_LIMIT_URL}
      RATE_LIMIT_TOKEN: ${RATE_LIMIT_TOKEN}
      APP_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app2:
    build: .
    environment:
      DATABASE_URL: postgresql://travel:travel@postgres:5432/travel
      DIRECT_URL: postgresql://travel:travel@postgres:5432/travel
      CACHE_URL: ${CACHE_URL}
      CACHE_TOKEN: ""
      RATE_LIMIT_URL: ${RATE_LIMIT_URL}
      RATE_LIMIT_TOKEN: ""
      APP_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app3:
    build: .
    environment:
      DATABASE_URL: postgresql://travel:travel@postgres:5432/travel
      DIRECT_URL: postgresql://travel:travel@postgres:5432/travel
      CACHE_URL: ${CACHE_URL}
      CACHE_TOKEN: ""
      RATE_LIMIT_URL: ${RATE_LIMIT_URL}
      RATE_LIMIT_TOKEN: ""
      APP_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  postgres_data:
  redis_data:
