name: Preview database

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  neon-branch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - run: npm ci
      - name: Create Neon branch
        id: branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          BRANCH_NAME: pr-${{ github.event.number }}
        run: |
          npx tsx scripts/create-neon-branch.ts >> "$GITHUB_OUTPUT"
      - name: Apply migrations to the preview database
        env:
          DATABASE_URL: ${{ steps.branch.outputs.DATABASE_URL }}
          DIRECT_URL: ${{ steps.branch.outputs.DIRECT_URL }}
        run: npx prisma migrate deploy
      - name: Point the Vercel preview at the branch database
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL: ${{ steps.branch.outputs.DATABASE_URL }}
          DIRECT_URL: ${{ steps.branch.outputs.DIRECT_URL }}
        run: |
          npx vercel env add DATABASE_URL preview --force --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
          npx vercel env add DIRECT_URL preview --force --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$DIRECT_URL"
